apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smart-asset-manager-route
  namespace: smart-asset-manager
spec:
  parentRefs:
    - name: mosalam-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "assets.mosalam.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
