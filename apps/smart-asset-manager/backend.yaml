apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smart-asset-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: master212/mosalam-backend:v1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: backend-db-credentials
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smart-asset-manager
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
